<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liquid Flow — Checkout</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script defer src="/verse-analytics.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--flow:#1E5BFF;--flow-2:#5B8DFF;--ink:#0A1B3D;--ink-2:#5B6B8C;--mist:#D7E7F9;--cloud:#F6F8FC;--line:#E5EAF2;--line-2:#EEF1F6;--white:#fff;--ok:#1D9E75;--ok-bg:#E1F5EE;--ok-tx:#0F6E56;--warn-bg:#FAEEDA;--warn-tx:#854F0B;--err:#A32D2D;--display:'Space Grotesk',sans-serif;--body:'Inter',sans-serif;--mono:'JetBrains Mono',monospace}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--body);color:var(--ink);background:var(--cloud);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
  .brand{display:flex;align-items:center;gap:9px;margin:8px 0 22px}
  .brand .wm{font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:-.4px;color:var(--ink)}.brand .wm span{color:var(--flow);font-weight:500}
  .card{width:100%;max-width:420px;background:var(--white);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 12px 40px rgba(10,27,61,.06)}
  .merchant{font-size:13px;color:var(--ink-2);font-weight:500}
  .label{font-size:14px;color:var(--ink);font-weight:500;margin-top:2px}
  .amount{font-family:var(--display);font-size:38px;font-weight:600;letter-spacing:-1.2px;margin:14px 0 2px;display:flex;align-items:baseline;gap:8px}
  .amount .sym{font-size:18px;color:var(--ink-2);font-weight:500}
  .chip{display:inline-block;background:#EAF1FF;color:var(--flow);border-radius:100px;padding:3px 11px;font-size:12px;font-weight:600;margin-top:4px}
  .qr{display:flex;justify-content:center;margin:22px 0 8px}
  .qr img{width:180px;height:180px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:8px}
  .addr-lbl{font-size:12px;color:var(--ink-2);font-weight:500;margin:16px 0 6px}
  .addr{display:flex;align-items:center;gap:8px;background:var(--cloud);border:1px solid var(--line-2);border-radius:11px;padding:11px 13px}
  .addr span{font-family:var(--mono);font-size:12.5px;word-break:break-all;color:var(--ink);flex:1}
  .copy{background:var(--white);border:1px solid var(--line-2);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}.copy:hover{background:#EAF1FF;color:var(--flow)}
  .status{display:flex;align-items:center;gap:9px;margin-top:20px;padding:13px 15px;border-radius:12px;font-size:13.5px;font-weight:500}
  .status.wait{background:var(--warn-bg);color:var(--warn-tx)}
  .status.ok{background:var(--ok-bg);color:var(--ok-tx)}
  .status.bad{background:#FBE9E9;color:var(--err)}
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .dot.pulse{background:currentColor;animation:pulse 1.3s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .expiry{font-size:12px;color:var(--ink-2);text-align:center;margin-top:14px}
  .check-btn{width:100%;margin-top:12px;border:1px solid var(--flow);background:#fff;color:var(--flow);border-radius:10px;padding:10px 13px;font-size:13px;font-weight:700;cursor:pointer}.check-btn:hover{background:#EAF1FF}.check-btn:disabled{opacity:.55;cursor:wait}
  .receipt{margin-top:14px;padding:14px;border:1px solid #B7DECf;background:#F0FAF6;border-radius:12px}.receipt-title{font-size:13px;font-weight:700;color:var(--ok-tx)}.receipt-note{font-size:11.5px;color:var(--ink-2);margin:3px 0 10px}.receipt-actions{display:flex;gap:8px;flex-wrap:wrap}.receipt-btn{border:1px solid #9ACFBC;background:#fff;color:var(--ok-tx);border-radius:8px;padding:8px 11px;font-size:11.5px;font-weight:700;cursor:pointer}.receipt-btn:hover{background:var(--ok-bg)}
  .foot{font-size:11.5px;color:var(--ink-2);text-align:center;margin-top:18px;line-height:1.5}
  .spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--flow);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .choose{text-align:center}.choose h1,.success-stage h1{font-family:var(--display);font-size:27px;line-height:1.15;letter-spacing:-.7px}.choose-sub,.success-stage p{color:var(--ink-2);font-size:13px;margin:7px 0 20px}.coin-grid{display:grid;gap:10px;text-align:left}.coin-option{width:100%;display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px 14px;cursor:pointer;transition:.18s}.coin-option:hover{border-color:var(--flow);background:#F7F9FF;transform:translateY(-1px)}.coin-icon{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--flow),#765BFF);color:#fff;font-weight:800}.coin-copy{flex:1}.coin-copy b{display:block;font-size:14px}.coin-copy span{display:block;font-size:11.5px;color:var(--ink-2)}.coin-arrow{color:var(--flow);font-size:20px}.loading-stage{text-align:center;padding:46px 0 36px}.loading-stage .spinner{margin:0 auto 18px}.loading-stage h2{font:600 20px var(--display)}.loading-stage p{font-size:12px;color:var(--ink-2);margin-top:5px}.confirm-note{text-align:center;color:var(--ink-2);font-size:11.5px;margin-top:12px}.success-stage{text-align:center;padding:20px 0 8px}.success-mark{width:76px;height:76px;border-radius:50%;background:var(--ok-bg);color:var(--ok-tx);display:grid;place-items:center;margin:0 auto 20px;font-size:42px;font-weight:700;animation:successPop .45s ease both}.success-stage .receipt{border:0;background:transparent;padding:0;margin-top:18px}.success-stage .receipt-actions{justify-content:center}.success-stage .receipt-btn{min-width:170px;background:var(--ok-tx);border-color:var(--ok-tx);color:#fff;padding:11px 18px}.success-stage .receipt-btn:hover{background:#0B5B47}.success-stage .spinner{width:20px;height:20px;margin:16px auto}.card.payment-card{animation:cardIn .28s ease both}@keyframes cardIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@keyframes successPop{0%{opacity:0;transform:scale(.7)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}</style>
</head>
<body>
  <div class="brand"><svg width="24" height="24" viewBox="0 0 56 56"><circle cx="28" cy="28" r="22" fill="none" stroke="#D7E7F9" stroke-width="3.5"/><path d="M5 28 a23 23 0 0 1 46 0" fill="none" stroke="#1E5BFF" stroke-width="3.5" stroke-linecap="round"/><path d="M28 15 C33 23,37 28,37 33 a9 9 0 0 1 -18 0 C19 28,23 23,28 15 Z" fill="#1E5BFF"/></svg><span class="wm">Liquid<span>Flow</span></span></div>

  <div class="card" id="card">
    <div class="spinner" id="spin"></div>
  </div>

<script>
  var params=new URLSearchParams(location.search);
  var id=params.get('id');
  var merchant=params.get('merchant');
  var encodedOrder=params.get('order');
  var poll=null,expiryTimer=null,receiptBundle=null,lastPayment=null,loading=false,manualQueued=false,confirmationNotified=false;
  var plateOrigin='https://plate-pulse-demo.vercel.app';
  var choices=[
    {asset:'VERSE',chain:'eip155:1',name:'VERSE',network:'Ethereum',icon:'V'},
    {asset:'fxVERSE',chain:'eip155:137',name:'fxVERSE',network:'Polygon',icon:'V'},
    {asset:'USDC',chain:'eip155:1',name:'USDC',network:'Ethereum',icon:'S'},
    {asset:'USDC',chain:'eip155:137',name:'USDC',network:'Polygon',icon:'S'},
    {asset:'USDC',chain:'eip155:8453',name:'USDC',network:'Base',icon:'S'}
  ];

  function fmtAmt(base,dec){try{return(Number(base)/Math.pow(10,dec!=null?dec:18)).toString()}catch(e){return base}}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(m){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[m]})}
  function chainName(c){return({'eip155:1':'Ethereum','eip155:137':'Polygon','eip155:8453':'Base'})[c]||c}
  function copyAddr(a,el){if(navigator.clipboard)navigator.clipboard.writeText(a);if(el){var old=el.textContent;el.textContent='Copied';setTimeout(function(){el.textContent=old},1200)}}
  function decodeOrder(){try{var raw=encodedOrder.replace(/-/g,'+').replace(/_/g,'/');while(raw.length%4)raw+='=';var items=JSON.parse(atob(raw));return Array.isArray(items)?items:null}catch(e){return null}}
  function postToFood(type,payment){if(window.opener&&!window.opener.closed)window.opener.postMessage({type:type,payment:payment||null},plateOrigin)}

  function renderSelection(){
    var items=decodeOrder();
    if(merchant!=='plate-pulse'||!items){document.getElementById('card').innerHTML='<div class="status bad"><span>This checkout link is invalid.</span></div>';return}
    document.getElementById('card').className='card payment-card';
    document.getElementById('card').innerHTML='<div class="choose"><h1>Choose how to pay</h1><p class="choose-sub">Select your coin and network.</p><div class="coin-grid">'+choices.map(function(c,i){return'<button class="coin-option" onclick="choosePayment('+i+')"><span class="coin-icon">'+c.icon+'</span><span class="coin-copy"><b>'+c.name+'</b><span>'+c.network+'</span></span><span class="coin-arrow">›</span></button>'}).join('')+'</div></div>';
  }

  async function choosePayment(index){
    var choice=choices[index],items=decodeOrder();if(!choice||!items)return;
    document.getElementById('card').innerHTML='<div class="loading-stage"><div class="spinner"></div><h2>Preparing payment</h2><p>Assigning a secure payment address…</p></div>';
    try{
      var r=await fetch(plateOrigin+'/api/payment?action=create',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({items:items,chain:choice.chain,asset:choice.asset})});
      var data=await r.json();if(!r.ok)throw new Error(data.error||'Payment could not be created');
      id=data.payment_id;history.replaceState({},'',location.pathname+'?id='+encodeURIComponent(id));postToFood('liquidflow:payment-created',data);load();poll=setInterval(function(){load(false)},2000);
    }catch(e){document.getElementById('card').innerHTML='<div class="status bad"><span>'+esc(e.message||'Payment could not be created')+'</span></div><button class="check-btn" onclick="renderSelection()">Try again</button>'}
  }

  function renderSuccess(p){
    document.getElementById('card').className='card payment-card';
    document.getElementById('card').innerHTML='<div class="success-stage"><div class="success-mark">✓</div><h1>Payment successful</h1><p>Your order is confirmed.</p><div class="receipt" id="receipt"><div class="spinner"></div></div></div>';
    if(!confirmationNotified){confirmationNotified=true;postToFood('liquidflow:payment-confirmed',{payment_id:p.payment_id})}
    loadReceipt(p.payment_id);if(poll){clearInterval(poll);poll=null}if(expiryTimer){clearInterval(expiryTimer);expiryTimer=null}
  }

  function render(p){
    if(p.status==='confirmed'){renderSuccess(p);return}
    var amt=fmtAmt(p.amount,p.decimals),qr='https://api.qrserver.com/v1/create-qr-code/?size=180x180&margin=0&data='+encodeURIComponent(p.deposit_address);
    var statusHtml='Waiting for payment',statusCls='wait',statusDot='<span class="dot pulse"></span>';
    if(p.status==='expired'){statusCls='bad';statusDot='';statusHtml='Time expired. Paid already? Click Confirm.'}
    else if(p.status==='cancelled'){statusCls='bad';statusDot='';statusHtml='Payment cancelled.'}
    else if(p.status==='checking_finality'){var progress=p.confirmation_progress;statusHtml=progress?('Payment detected · '+Math.min(progress.seen,progress.required)+'/'+progress.required+' confirmations'):'Payment detected. Finalizing on-chain.'}
    else if(p.status==='awaiting_topup'){statusHtml='Partial payment received.'}
    else if(p.status==='refund_pending'){statusCls='bad';statusDot='';statusHtml='Payment needs review.'}
    else if(p.status==='manual_review'){statusCls='bad';statusDot='';statusHtml='Payment needs merchant review.'}
    var showPay=p.status!=='cancelled';
    var html='<div class="merchant">Pay '+esc(p.merchant_name)+'</div>'+(p.label?'<div class="label">'+esc(p.label)+'</div>':'')+'<div class="amount">'+amt+'<span class="sym">'+esc(p.symbol||p.asset)+'</span></div><div class="chip">'+chainName(p.chain)+'</div>';
    if(showPay)html+='<div class="qr"><img alt="Scan to pay" src="'+qr+'"></div><div class="addr-lbl">Send exactly '+amt+' '+esc(p.symbol||p.asset)+'</div><div class="addr"><span id="addr">'+esc(p.deposit_address)+'</span><button class="copy" onclick="copyAddr(\''+p.deposit_address+'\',this)">Copy</button></div>';
    html+='<div class="status '+statusCls+'">'+statusDot+'<span>'+statusHtml+'</span></div>';
    if(['awaiting_payment','awaiting_topup','checking_finality','expired'].indexOf(p.status)>=0)html+='<div class="confirm-note">Sent the payment? Click Confirm.</div><button class="check-btn" id="manualCheck" onclick="manualCheck()">Confirm</button>';
    if(showPay&&p.expires_at)html+='<div class="expiry" id="expiry"></div>';
    document.getElementById('card').className='card payment-card';document.getElementById('card').innerHTML=html;
    if(showPay&&p.expires_at)startExpiry(p.expires_at);else if(expiryTimer)clearInterval(expiryTimer);
    if(['cancelled','refund_pending','manual_review'].indexOf(p.status)>=0&&poll){clearInterval(poll);poll=null}
  }

  function startExpiry(ts){if(expiryTimer)clearInterval(expiryTimer);var tick=function(){var el=document.getElementById('expiry');if(!el)return;var seconds=Math.max(0,Math.floor((ts-Date.now())/1000)),minutes=Math.floor(seconds/60),rest=('0'+seconds%60).slice(-2);el.textContent=seconds>0?'Expires in '+minutes+':'+rest:'Expired'};tick();expiryTimer=setInterval(tick,1000)}
  function receiptStorageKey(paymentId){return'liquidflow:receipt:'+paymentId}
  function showReceipt(bundle){receiptBundle=bundle;var el=document.getElementById('receipt');if(el)el.innerHTML='<div class="receipt-actions"><button class="receipt-btn" onclick="downloadReceipt()">Download receipt</button></div>'}
  async function loadReceipt(paymentId){var stored=null;try{stored=localStorage.getItem(receiptStorageKey(paymentId))}catch(e){}try{var r=await fetch('/api/receipt?action=get&id='+encodeURIComponent(paymentId));if(!r.ok)throw new Error();var bundle=await r.json();try{localStorage.setItem(receiptStorageKey(paymentId),JSON.stringify(bundle))}catch(e){}showReceipt(bundle)}catch(e){if(stored){try{showReceipt(JSON.parse(stored));return}catch(x){}}var el=document.getElementById('receipt');if(el)el.innerHTML='<button class="receipt-btn" onclick="loadReceipt(\''+paymentId+'\')">Retry receipt</button>'}}
  function downloadReceipt(){if(!receiptBundle)return;var blob=new Blob([JSON.stringify(receiptBundle,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='liquidflow-'+receiptBundle.receipt.payment_id+'-receipt.json';a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)}
  async function load(manual){if(!id)return;if(loading){if(manual)manualQueued=true;return}loading=true;try{var r=await fetch('/api/checkout/'+id+'?check='+(manual?'manual':'auto')+'&t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(9000)});if(!r.ok)throw new Error((await r.json().catch(function(){return{}})).error||'Payment not found');lastPayment=await r.json();render(lastPayment)}catch(e){if(lastPayment){var status=document.querySelector('.status');if(status){status.className='status bad';status.innerHTML='<span>Network check delayed. Watching continues automatically.</span>'}}else document.getElementById('card').innerHTML='<div class="status bad"><span>Payment could not be loaded.</span></div><button class="check-btn" onclick="load(true)">Retry</button>'}finally{loading=false;if(manualQueued){manualQueued=false;setTimeout(function(){load(true)},0)}}}
  async function manualCheck(){var button=document.getElementById('manualCheck');if(button){button.disabled=true;button.textContent='Checking network…'}await load(true)}

  if(id){load();poll=setInterval(function(){load(false)},2000)}else if(merchant&&encodedOrder){renderSelection()}else document.getElementById('card').innerHTML='<div class="status bad"><span>Missing checkout details.</span></div>';
</script>
</body>
</html>
